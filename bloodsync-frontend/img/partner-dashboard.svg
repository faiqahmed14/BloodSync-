<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A hospital dashboard with stock bars and request list">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f36"/><stop offset="1" stop-color="#14181c"/></linearGradient></defs>
  <style>.b{transform-box:fill-box;transform-origin:bottom;animation:g 3s ease-in-out infinite}.b:nth-child(2n){animation-delay:.5s}.b:nth-child(3n){animation-delay:1s}@keyframes g{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}text{font-family:Inter,Arial,sans-serif}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style>
  <rect width="600" height="320" fill="url(#bg)"/>
  <rect x="50" y="40" width="500" height="240" rx="18" fill="#1c2127" stroke="#f1ede6" stroke-opacity=".15"/><rect x="50" y="40" width="500" height="40" rx="18" fill="#2b323a"/><circle cx="76" cy="60" r="6" fill="#d6302b"/><circle cx="96" cy="60" r="6" fill="#c9a227"/><circle cx="116" cy="60" r="6" fill="#1b8a6b"/>
  <g><rect class="b" x="84" y="170" width="26" height="80" rx="5" fill="#d6302b"/><rect class="b" x="122" y="140" width="26" height="110" rx="5" fill="#d6302b" fill-opacity=".85"/><rect class="b" x="160" y="190" width="26" height="60" rx="5" fill="#d6302b" fill-opacity=".7"/><rect class="b" x="198" y="120" width="26" height="130" rx="5" fill="#1b8a6b"/><rect class="b" x="236" y="150" width="26" height="100" rx="5" fill="#1b8a6b" fill-opacity=".85"/><rect class="b" x="274" y="205" width="26" height="45" rx="5" fill="#c9a227"/></g>
  <path d="M84 250H300" stroke="#f1ede6" stroke-opacity=".2"/>
  <g font-size="11" fill="#8b93a1"><text x="84" y="268">O-</text><text x="122" y="268">O+</text><text x="160" y="268">A-</text><text x="198" y="268">A+</text><text x="236" y="268">B+</text><text x="274" y="268">AB</text></g>
  <g><rect x="334" y="98" width="188" height="36" rx="9" fill="#2b323a"/><circle cx="352" cy="116" r="6" fill="#d6302b"/><rect x="368" y="108" width="90" height="7" rx="3.5" fill="#f1ede6" fill-opacity=".7"/><rect x="368" y="120" width="60" height="6" rx="3" fill="#8b93a1"/>
  <rect x="334" y="144" width="188" height="36" rx="9" fill="#2b323a"/><circle cx="352" cy="162" r="6" fill="#c9a227"/><rect x="368" y="154" width="100" height="7" rx="3.5" fill="#f1ede6" fill-opacity=".7"/><rect x="368" y="166" width="70" height="6" rx="3" fill="#8b93a1"/>
  <rect x="334" y="190" width="188" height="36" rx="9" fill="#2b323a"/><circle cx="352" cy="208" r="6" fill="#1b8a6b"/><rect x="368" y="200" width="80" height="7" rx="3.5" fill="#f1ede6" fill-opacity=".7"/><rect x="368" y="212" width="50" height="6" rx="3" fill="#8b93a1"/></g>
</svg>
