<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="A bag of donated blood with a tube and a falling drop">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2127"/><stop offset="1" stop-color="#14181c"/></linearGradient>
  <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5f"/><stop offset="1" stop-color="#8a2622"/></linearGradient>
  <radialGradient id="g" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#d6302b" stop-opacity=".3"/><stop offset="1" stop-color="#d6302b" stop-opacity="0"/></radialGradient>
  <clipPath id="bag"><path d="M210 120h180a24 24 0 0 1 24 24v250a40 40 0 0 1-40 40H226a40 40 0 0 1-40-40V144a24 24 0 0 1 24-24Z"/></clipPath></defs>
  <style>.w{animation:w 3.4s ease-in-out infinite}@keyframes w{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}
