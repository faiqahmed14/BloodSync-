<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A requester pin with the nearest matching donors around it">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2127"/><stop offset="1" stop-color="#14181c"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f1ede6" stroke-opacity=".06"/></pattern></defs>
  <style>.pr{transform-origin:300px 150px;animation:pr 3.4s ease-out infinite;fill:none;stroke:#d6302b;stroke-width:1.5;stroke-dasharray:5 6}.pr.b{animation-delay:1.7s}
  @keyframes pr{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}text{font-family:Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){.pr{animation:none}}</style>
  <rect width="600" height="300" fill="url(#bg)"/><rect width="600" height="300" fill="url(#grid)"/>
  <path d="M0 210C120 190 190 250 330 215S520 160 600 190M120 0C150 90 120 160 190 300M430 0C410 80 470 150 440 300" fill="none" stroke="#f1ede6" stroke-opacity=".1" stroke-width="10" stroke-linecap="round"/>
