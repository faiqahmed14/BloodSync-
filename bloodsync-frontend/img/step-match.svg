  <circle class="pr" cx="300" cy="150" r="98"/><circle class="pr b" cx="300" cy="150" r="98"/>
  <path d="M300 150L228 112" stroke="#1b8a6b" stroke-width="2.5" stroke-dasharray="4 5"/>
  <g font-size="11" font-weight="700" text-anchor="middle"><g fill="#1b8a6b"><circle cx="228" cy="112" r="15"/><circle cx="395" cy="98" r="13" fill-opacity=".55"/><circle cx="410" cy="206" r="13" fill-opacity=".55"/><circle cx="150" cy="214" r="13" fill-opacity=".55"/><circle cx="470" cy="150" r="11" fill-opacity=".35"/></g>
  <g fill="#fff"><text x="228" y="116">O-</text><text x="395" y="102">A+</text><text x="410" y="210">O-</text><text x="150" y="218">B+</text><text x="470" y="154" font-size="10">AB</text></g></g>
  <path d="M300 178c-14-18-24-32-24-46a24 24 0 0 1 48 0c0 14-10 28-24 46Z" fill="#d6302b" stroke="#fff" stroke-width="2.5"/><circle cx="300" cy="132" r="8" fill="#fff"/>
  <g><rect x="190" y="52" width="104" height="28" rx="14" fill="#1b8a6b"/><text x="242" y="71" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Nearest: 0.8 km</text></g>
